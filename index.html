<script>
window.SUPABASE_URL = window.SUPABASE_URL || "https://cjycmcfnkuudyxfyxdaa.supabase.co";
window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_00wPoA0XpB24sJfcP8YZqQ__S_eytuQ";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  function slotGrid(){
    var all = document.querySelectorAll("p"), ps = null;
    for(var i=0;i<all.length;i++){ if(all[i].textContent.trim()==="Recommended Slots"){ ps = all[i]; break; } }
    if(!ps) return null;
    var wrap = ps.parentElement;
    var g = wrap.querySelector(".grid");
    if(g) return g;
    var sib = ps.nextElementSibling;
    while(sib){
      if(sib.querySelector && sib.querySelector("button")) return sib;
      sib = sib.nextElementSibling;
    }
    return null;
  }
  var statusEl = null;
  function setStatus(msg, isError){
    try{
      var grid = slotGrid();
      if(!grid) return;
      if(!statusEl){
        statusEl = document.createElement("div");
        statusEl.setAttribute("data-sb-status","1");
        statusEl.style.cssText = "grid-column:1/-1;text-align:center;font-size:12px;padding:8px;";
        grid.parentElement.insertBefore(statusEl, grid);
      }
      statusEl.textContent = msg;
      statusEl.style.color = isError ? "#dc2626" : "#64748b";
      statusEl.style.display = msg ? "" : "none";
    }catch(e){}
  }

  var sb = null;
  try{
    var URL = window.SUPABASE_URL || "";
    var KEY = window.SUPABASE_ANON_KEY || "";
    if(!URL || KEY.indexOf("YOUR_") === 0) throw new Error("Supabase keys not configured in index.html.");
    if(!window.supabase) throw new Error("Supabase library failed to load (check internet connection).");
    sb = window.supabase.createClient(URL, KEY);
    window._sb = sb;
  }catch(err){
    var iv = setInterval(function(){
      if(slotGrid()){ clearInterval(iv); setStatus("Supabase connection failed: " + err.message, true); }
    }, 1000);
    return;
  }

  function currentDateLabel(){
    var els = document.querySelectorAll("p");
    for(var i=0;i<els.length;i++){
      var t = els[i].textContent.trim();
      if(/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat),\s/.test(t)) return t;
    }
    return null;
  }
  function parseLabelToISO(label){
    var m = label.match(/([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{4})/);
    if(!m) return null;
    var months={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
    var key = m[1].charAt(0).toUpperCase() + m[1].slice(1,3).toLowerCase();
    if(!months[key]) return null;
    return m[3]+"-"+months[key]+"-"+String(m[2]).padStart(2,"0");
  }

  var selectedDateISO = null;

  function renderSlots(grid, slots){
    grid.innerHTML = "";
    slots.forEach(function(s){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = s.time;
      b.setAttribute("data-sb-slot", s.time);
      b.style.cssText = "background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:14px 4px;font-size:15px;font-weight:700;color:#1E293B;min-height:62px;cursor:pointer";
      b.onclick = function(){
        var btns = grid.querySelectorAll("button");
        for(var i=0;i<btns.length;i++){ btns[i].style.border="1px solid #E5E7EB"; btns[i].style.background="#fff"; btns[i].style.color="#1E293B"; }
        b.style.border = "2px solid #2563EB"; b.style.background = "#EFF6FF"; b.style.color = "#2563EB";
        window._sbSelectedTime = s.time;
        var spans = document.querySelectorAll("span");
        for(var j=0;j<spans.length;j++){
          if(/^\d{2}:\d{2} (AM|PM)$/.test(spans[j].textContent.trim())){ spans[j].textContent = s.time; break; }
        }
      };
      grid.appendChild(b);
    });
  }

  function loadSlots(){
    var grid = slotGrid();
    if(!grid) return;
    var label = currentDateLabel();
    if(!label){ setStatus("Pick a date to see available slots.", false); return; }
    var iso = parseLabelToISO(label);
    if(!iso) return;
    selectedDateISO = iso;
    setStatus("Loading slots for " + label + "...", false);
    sb.from("slots").select("time").eq("date", iso).eq("is_available", true).order("time")
      .then(function(res){
        if(res.error) throw res.error;
        var slots = res.data || [];
        if(!slots.length){
          grid.innerHTML = "";
          setStatus("No slots found for " + label + ". Either no rows in Supabase for this date, or RLS is blocking reads.", true);
          return;
        }
        setStatus("", false);
        renderSlots(grid, slots);
      })
      .catch(function(err){
        setStatus("Could not load slots: " + err.message, true);
      });
  }

  try{
    sb.channel("slots-rt")
      .on("postgres_changes", {event:"*", schema:"public", table:"slots"}, function(){ selectedDateISO = null; loadSlots(); })
      .subscribe();
  }catch(e){}

  var lastLabel = "__init__";
  setInterval(function(){
    var l = currentDateLabel() || "";
    if(l !== lastLabel){ lastLabel = l; loadSlots(); return; }
    var g = slotGrid();
    if(g && selectedDateISO && !g.querySelector("[data-sb-slot]")){ loadSlots(); }
  }, 1500);

  var tries = 0;
  var boot = setInterval(function(){
    tries++;
    if(slotGrid() || tries > 25){ clearInterval(boot); loadSlots(); }
  }, 800);

  document.addEventListener("click", function(e){
    var btn = (e.target && e.target.closest) ? e.target.closest("button") : null;
    if(!btn || !/Confirm Booking/.test(btn.textContent || "")) return;
    setTimeout(function(){
      var inputs = document.querySelectorAll("input");
      var name = "", mobile = "";
      for(var i=0;i<inputs.length;i++){
        var ph = inputs[i].placeholder || "";
        if(ph.indexOf("Rahul") !== -1) name = inputs[i].value;
        if(ph.indexOf("10-digit") !== -1) mobile = inputs[i].value;
      }
      var label = currentDateLabel() || "";
      var iso = parseLabelToISO(label) || "";
      var time = window._sbSelectedTime || "";
      var service = "";
      var divs = document.querySelectorAll("div");
      for(var k=0;k<divs.length;k++){
        if(divs[k].textContent === "Booking Summary"){
          var spans = divs[k].parentElement.querySelectorAll("span");
          for(var s2=0;s2<spans.length;s2++){
            var t = spans[s2].textContent.trim();
            if(t && t!=="Date" && t!=="Time" && t.indexOf("/") === -1 && !/^\d{2}:\d{2}/.test(t)){ service = t; break; }
          }
          break;
        }
      }
      name = (name||"").trim(); mobile = (mobile||"").trim();
      if(!name || !mobile || !iso || !time || !service){
        alert("Please fill name, mobile number, and select a service, date and time slot.");
        return;
      }
      sb.from("appointments").insert({date: iso, time: time, service: service, patient_name: name, mobile: mobile})
        .then(function(ins){
          if(ins.error) throw ins.error;
          return sb.from("slots").update({is_available: false}).eq("date", iso).eq("time", time);
        })
        .then(function(){ alert("Booking saved!"); })
        .catch(function(err){ alert("Could not save booking: " + err.message); });
    }, 900);
  }, true);

  window._sbTest = function(){
    sb.from("slots").select("id").limit(1).then(function(r){
      alert(r.error ? "Supabase ERROR: " + r.error.message : "Supabase OK - slots table reachable.");
    });
  };
